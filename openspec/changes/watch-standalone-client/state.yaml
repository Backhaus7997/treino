    Ese ciclo modela "el telefono manda, el reloj espeja". El dueño pidio un
    cliente autonomo que funcione con el celular guardado. No le falta un
    pedazo: parte de otra premisa. Se conserva INTACTO como registro de lo
    descartado y por que.
