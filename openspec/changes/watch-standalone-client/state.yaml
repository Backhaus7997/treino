  verificar. Hasta entonces la mitigacion del riesgo #1 esta a medias.
  Anotado tambien en conformance/README.md.
    pendiente_sin_verificar: |
      Si WCSession requiere algun capability nuevo en Signing &
      Capabilities. El ciclo viejo afirmaba que no, y sigue sin
      comprobarse. Si aparece uno, es señal de volver a design.

