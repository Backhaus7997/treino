blocked_on: |
  Nada bloquea el avance. Lo unico pendiente es una PRUEBA A MANO en el
  simulador de la navegacion de F5 — recorrer las tres paginas, activar un
  plan y empezar una plantilla comprobando que activeRoutineId no cambia.
  Requiere un build de Xcode, que se corto a pedido del dueño para dejarle
  la maquina libre y generar el IPA.

coordinacion: |
  Sesion paralela en worktree wizardly-dijkstra-a16063 (migracion a follow
  asimetrico) toca functions/src/**. Este change AGREGA un archivo nuevo ahi
  (watch-rest-session-writes-rules.test.ts) y NO modifica ninguno existente
  — tampoco functions/package.json, porque `npm test` levanta los archivos
  nuevos solo. Sin conflicto de contenido esperado.

nota: |
  Este ciclo se armo en el repo local con acceso al codigo, y cada
  afirmacion de plataforma esta verificada contra la fuente:
  - Firestore NO figura entre los productos Firebase soportados en watchOS
    (watchOS es community-supported). Auth, Storage, Crashlytics y
    Analytics si.
  - La REST API de Firestore acepta ID tokens de Firebase Auth como Bearer
    y las Security Rules SE APLICAN a esas requests.
  - Google Sign-In no tiene SDK de watchOS; Sign in with Apple si.
  Las correcciones al ciclo anterior estan tabuladas en explore.md.
