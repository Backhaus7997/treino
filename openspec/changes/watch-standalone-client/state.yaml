change: watch-standalone-client
fase: "Sin asignar — capability nueva, fuera del roadmap actual"
branch: feat/workout-watch-connectivity
artifact_store: openspec
execution_mode: interactive
delivery_strategy: chained-pr
tdd: strict

supersede:
  change: watch-connectivity
  path: openspec/changes/watch-connectivity/
  motivo: |
    Ese ciclo modela "el telefono manda, el reloj espeja". El dueño pidio un
    cliente autonomo que funcione con el celular guardado. No le falta un
    pedazo: parte de otra premisa. Se conserva INTACTO como registro de lo
    descartado y por que.
  estado: conservado sin modificar

phases:
  explore: done
  propose: done
  spec: pending
  design: pending
  tasks: pending
  apply: pending
  verify: pending
  archive: pending

locked_decisions: firmadas por el dueño (las 8 del proposal §4)

fases_implementacion:
  F0:
    estado: COMPLETA
    hecho:
      - |
        VERIFICADO: las Security Rules se aplican a escrituras REST de
        Firestore. Probado contra el emulador con ID token de Firebase Auth
        como Bearer. Dueño escribe su sesion -> 200; dueño escribe setLogs
        -> 200; tercero con token valido -> 403; sin token -> 403.
        Es la premisa sobre la que descansa toda la arquitectura: sostiene.
      - |
        Test permanente en functions/src/__tests__/watch-rest-session-writes-rules.test.ts
        (6 casos, verde). Va en functions/ y NO en scripts/rules_test/ porque
        ese directorio NO corre en CI ("NOT part of CI" en scripts/test_rules.sh)
        y la prueba se pudriria en silencio. Corre bajo `npm --prefix functions
        test`, que es lo que ejecuta el job functions-test.
      - docs/setup/watchos-target.md — prerequisito manual documentado
      - |
        Target watchOS creado y enganchado a Runner. El wizard de Xcode 26.3
        lo dejo desconectado porque su desplegable de "companion app" no se
        abre (probado varias veces, tampoco a mano). Completado editando el
        pbxproj: PBXBuildFile, fase "Embed Watch Content",
        PBXContainerItemProxy + PBXTargetDependency, y el enganche al target
        Runner. VERIFICADO: xcodebuild -list lista los 3 targets; los
        settings resueltos dan com.backhaus.treino.watchkitapp +
        WKCompanionAppBundleIdentifier=com.backhaus.treino + team
        J66AQRRM96 + SDK watchOS 26.2; y `xcodebuild -scheme Runner` da
        BUILD SUCCEEDED compilando el target del reloj, que antes no pasaba.
    pendiente: []

  F1:
    estado: en curso
    objetivo: |
      Auth en el reloj + lectura de rutina + fixtures de conformidad.
    hecho:
      - |
        VERIFICADO: el reloj renueva su credencial SIN el SDK de Firebase.
        El telefono le pasa el refresh token una vez y el reloj lo canjea
        por ID tokens frescos contra securetoken.googleapis.com por HTTP
        (expires_in 3600). El token renovado escribe en Firestore (200).
        CONSECUENCIA: el target watchOS queda con CERO dependencias de
        Firebase -> nueva Locked Decision #9, y el riesgo #5 del proposal
        (Firebase watchOS community-supported) queda DISUELTO.
      - |
        VERIFICADO: lectura de rutinas por REST con las rules aplicandose.
        Atleta asignado lee su rutina privada (200); tercero denegado
        (403); sin token denegado (403); rutina publica legible por
        cualquier autenticado (200); rutina inexistente da 404 y no 403,
        que es el comportamiento deliberado del guard `resource == null`.
      - |
        Test permanente: functions/src/__tests__/watch-rest-auth-and-routine-reads-rules.test.ts
        (8 casos, verde). Seed via `Authorization: Bearer owner`, el
        superusuario del emulador, porque crear una rutina respetando las
        rules exige el flujo de PF o el self-authored.
      - |
        `watch_connectivity: ^0.2.8` agregado a pubspec.yaml, con comentario
        que fija su alcance ACOTADO (solo el handoff de credencial, no el
        puente de datos). Coordinado con la sesion paralela del worktree
        wizardly-dijkstra-a16063, que tambien mergea a main.
      - |
        Fixtures de conformidad ARRANCADOS. conformance/plan_advance.json
        (12 casos) + conformance/README.md + corredor Dart en
        test/conformance/. Se extrajo la aritmetica de dia/semana de
        todaysRoutineProvider a nextPlanPosition
        (workout/domain/plan_advance.dart): estaba embebida en un
        FutureProvider, sin ser testeable como funcion pura ni portable.
        La extraccion no cambio comportamiento (23 tests previos verdes).
        VERIFICADO que el mecanismo detecta divergencia y no solo pasa:
        se rompio la logica a proposito dos veces y el test se puso rojo
        con mensaje util. Ambas roturas revertidas.
    pendiente:
      - Handoff del refresh token telefono -> reloj (codigo Dart + Swift).
      - Guardar el refresh token en el Keychain del reloj.
      - UI minima en el reloj: mostrar el entreno de hoy.
      - |
        Mas fixtures a medida que se porte logica: idempotencia por
        exerciseId + setNumber, isFullyCompleted, totalVolumeKg, durationMin.

brecha_conocida: |
  Los fixtures de conformidad hoy los corre UN SOLO lado (Dart). Eso fija
  el contrato pero todavia NO detecta divergencia: hace falta el corredor
  Swift, que llega en F2 cuando el target watchOS tenga logica que
  verificar. Hasta entonces la mitigacion del riesgo #1 esta a medias.
  Anotado tambien en conformance/README.md.
    pendiente_sin_verificar: |
      Si WCSession requiere algun capability nuevo en Signing &
      Capabilities. El ciclo viejo afirmaba que no, y sigue sin
      comprobarse. Si aparece uno, es señal de volver a design.

artifacts:
  explore: openspec/changes/watch-standalone-client/explore.md
  proposal: openspec/changes/watch-standalone-client/proposal.md
  f0_rules_proof: functions/src/__tests__/watch-rest-session-writes-rules.test.ts
  f0_setup_doc: docs/setup/watchos-target.md

blocked_on: |
  F0 no cierra hasta que exista el target watchOS (paso humano con Xcode).
  El resto de F0 esta hecho y verificado.

coordinacion: |
  Sesion paralela en worktree wizardly-dijkstra-a16063 (migracion a follow
  asimetrico) toca functions/src/**. Este change AGREGA un archivo nuevo ahi
  (watch-rest-session-writes-rules.test.ts) y NO modifica ninguno existente
  — tampoco functions/package.json, porque `npm test` levanta los archivos
  nuevos solo. Sin conflicto de contenido esperado.

nota: |
  Este ciclo se armo en el repo local con acceso al codigo, y cada
  afirmacion de plataforma esta verificada contra la fuente:
  - Firestore NO figura entre los productos Firebase soportados en watchOS
    (watchOS es community-supported). Auth, Storage, Crashlytics y
    Analytics si.
  - La REST API de Firestore acepta ID tokens de Firebase Auth como Bearer
    y las Security Rules SE APLICAN a esas requests.
  - Google Sign-In no tiene SDK de watchOS; Sign in with Apple si.
  Las correcciones al ciclo anterior estan tabuladas en explore.md.
