name: treino
description: "TREINO — fitness app multiplataforma."
publish_to: 'none'
version: 0.1.0+16

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.0
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3
  firebase_app_check: ^0.3.2
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  phosphor_flutter: ^2.1.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  font_awesome_flutter: ^10.7.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  cloud_firestore: ^5.4.0
  cloud_functions: ^5.2.0
  file_picker: ^8.1.2
  excel: ^4.0.6
  web: ^1.1.0
  google_sign_in: ^7.1.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.3
  characters: ^1.3.0
  geolocator: ^14.0.2
  http: ^1.2.2
  table_calendar: ^3.2.0
  flutter_map: ^7.0.2
  flutter_map_marker_cluster: ^1.3.6
  latlong2: ^0.9.1
  # ExerciseVideoPlayer is dual-mode:
  # • YouTube links → thumbnail card; tap opens youtube.com in a
  #   Safari View Controller / Chrome Custom Tab via url_launcher's
  #   inAppBrowserView mode (the user never leaves TREINO).
  # • Firebase Storage videos (trainer's own uploads) → native inline
  #   playback via video_player, no WebView in the loop at all.
  # We landed here after 7 iterations proving that YouTube embeds inside
  # any iOS WKWebView wrapper get rejected with Error 152/153 by YouTube's
  # server-side "real browser" check.
  url_launcher: ^6.3.0
  video_player: ^2.9.0
  shared_preferences: ^2.3.0
  fl_chart: ^1.2.0
  firebase_messaging: ^15.0.0
  # Companion de Apple Watch (change watch-standalone-client). Su rol es
  # ACOTADO: entregarle al reloj el refresh token UNA vez, en el pairing.
  # No es el puente de datos — el reloj habla Firestore por su REST API y
  # renueva credencial contra securetoken.googleapis.com, todo por HTTP y
  # sin SDK de Firebase (Locked Decision #9). Firebase en watchOS es
  # community-supported y Firestore ni figura entre sus productos.
  # Android/Wear OS NO está soportado en v1: el paquete cubre ambos lados,
  # pero exige que reloj y teléfono compartan clave de firma, y la firma de
  # release de Android sigue en debug keys (android/app/build.gradle).
  watch_connectivity: ^0.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Driver de los tests de `integration_test/` (flujos end-to-end sobre un
  # dispositivo o emulador real, vía `flutter test integration_test`). Faltaba
  # declararlo, así que los 5 archivos de esa carpeta no resolvían el import y
  # `flutter analyze` tiraba 15 issues sobre código que en realidad está bien.
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.0.3
  # Generates ios/Runner/Assets.xcassets/AppIcon.appiconset/ from a single
  # 1024×1024 source (assets/icon/app_icon.png). Run after changing the
  # source: `dart run flutter_launcher_icons`. NOT a runtime dependency
  # — only invoked during build setup.
  flutter_launcher_icons: ^0.14.4

# flutter_launcher_icons config.
#
# `android` estuvo en `false` desde que se configuró esto, así que los
# `mipmap-*/ic_launcher.png` del repo nunca se generaron y siguieron siendo los
# que deja `flutter create`: el logo de Flutter. Eso es lo que se veía en el
# teléfono Y en las instalaciones desde Play Console, porque el AAB empaqueta
# esos mismos archivos.
#
# Tras tocar cualquiera de las fuentes hay que regenerar:
#   dart run flutter_launcher_icons
# y commitear lo que aparezca bajo android/app/src/main/res/ e ios/.
flutter_launcher_icons:
  ios: true
  android: true
  # Ícono legacy (Android 7 y anteriores): el cuadrado completo, con su fondo.
  image_path: "assets/icon/app_icon.png"

  # Adaptive icon (Android 8+). El launcher recorta con SU máscara —círculo,
  # squircle, gota según el fabricante— y solo garantiza el 66% central del
  # lienzo. El logo original ocupa el 80% del alto, así que pasarlo tal cual
  # como foreground le comía las puntas al "TR"; por eso el foreground es un
  # asset aparte con el logo al 58% y el resto transparente. El fondo lo
  # aporta este color, no la imagen.
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

  # Themed icon (Android 13+): el launcher lo repinta con los colores del
  # tema del sistema. Mismo trazo, en blanco, para que el tintado salga limpio.
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"

  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/routines/
    - assets/muscles/
    - assets/exercises/
    - assets/body/
    # Tipografías bundleadas. Van bajo `assets:` y NO bajo `fonts:` a
    # propósito: google_fonts las resuelve buscando en el AssetManifest un
    # archivo llamado `{Familia}-{Variante}.ttf`. Declaradas bajo `fonts:`
    # Flutter las registraría, pero google_fonts no las encontraría y las
    # bajaría por red igual, que es justo lo que esto viene a evitar.
    - assets/fonts/
