# Dependabot — slice B de #680.
#
# Es la contraparte del job `npm-audit` de .github/workflows/security.yml: ese
# job SÓLO reporta (functions/ arranca con 1 critical y 3 high heredadas), y
# este archivo es lo que efectivamente las baja. Cuando el contador llegue a
# cero, el gate de npm audit pasa a bloqueante.
#
# Ritmo pensado para un equipo de 3: agrupado y semanal, no un PR por paquete.
# Sin `groups` esto abriría ~20 PRs la primera semana y nadie los revisa.
version: 2

updates:
  # ---------------------------------------------------------------------------
  # Cloud Functions — el código con privilegios de Admin SDK. Es el que más
  # importa: un CVE acá corre con permisos de servidor sobre todos los datos.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    # A main sólo entra develop (docs/workflow.md): los bumps también.
    target-branch: develop
    directory: /functions
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - 'type:chore'
    groups:
      # Los majors van sueltos: firebase-admin 12→14 y jest 29→30 rompen API y
      # necesitan review humano, no pueden viajar de polizón en un PR grupal.
      functions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    # `@types/node` va con el runtime (`engines.node` y `nodejs22`): con tipos de
    # un Node más nuevo, el código puede compilar usando APIs que en producción no
    # existen, y el CI sale verde igual. Ignorar sólo la versión del PR no alcanza:
    # cerrar la 26 (#1669) trajo la 25 (#1687). Se saca al migrar el runtime.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # ---------------------------------------------------------------------------
  # Tooling local de seed (scripts/) — no corre en producción, pero comparte
  # firebase-admin con functions/ y hoy también tiene 1 critical + 3 high.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    # A main sólo entra develop (docs/workflow.md): los bumps también.
    target-branch: develop
    directory: /scripts
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    labels:
      - 'type:chore'
    groups:
      scripts-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

    # firebase-admin YA NO se ignora: `scripts/` está migrado a los subpaths
    # modulares y corre contra la v14.
    #
    # Este bloque existió porque el bump a 14 se mergeó DOS veces (cac2d6fa y
    # de77562a/#901) y las dos dejó los 44 scripts muertos. Lo que lo hacía
    # invisible era que `scripts-test` no instalaba nada; eso lo arregló el
    # #971, y `test/firebase_admin_superficie.test.js` es el trinquete que hoy
    # carga el SDK de verdad. Con esa red puesta, un major de firebase-admin ya
    # no necesita un `ignore` para ser seguro: necesita que el trinquete lo mire.

  # ---------------------------------------------------------------------------
  # Tests de reglas standalone (scripts/rules_test/). @firebase/rules-unit-testing
  # está en ^3 acá y en ^5 en functions/ — Dependabot va a proponer alinearlos.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    # A main sólo entra develop (docs/workflow.md): los bumps también.
    target-branch: develop
    directory: /scripts/rules_test
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    labels:
      - 'type:chore'
    groups:
      rules-test-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  # ---------------------------------------------------------------------------
  # GitHub Actions.
  #
  # Los workflows corren con acceso al repo y, en el caso de CodeQL, con
  # `security-events: write`. Una action desactualizada con una vuln de command
  # injection es escalación directa sobre el CI. Barato de mantener: son 5
  # actions en total entre ci.yml y security.yml.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    # A main sólo entra develop (docs/workflow.md): los bumps también.
    target-branch: develop
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    labels:
      - 'type:chore'
    groups:
      actions:
        patterns: ['*']
        # Sin este filtro el grupo se llevaba TODO, majors incluidos, y eso
        # contradice la política que declara este archivo más arriba ("los
        # majors van sueltos"). Concreto: el PR #885 juntó upload-artifact
        # v4->v7, setup-swift v2->v3 y setup-java v5->v6, y falló justo en
        # `Conformance (Swift)` y `Watch capabilities` — los dos jobs que usan
        # esas dos actions. Un bump de action que rompe un job tiene que llegar
        # solo, para que el rojo apunte a UNA causa.
        #
        # Acá NO se ignoran los majors, como sí se hace en pub: una action major
        # suele ser un cambio de runtime de Node y se revisa en cinco minutos.
        # Lo único que se pide es que no viaje de polizón.
        update-types: [minor, patch]

    # ── La excepción: setup-swift v3 NO EXISTE todavía como estable ──────────
    #
    # El párrafo de arriba dice que los majors de actions se revisan en cinco
    # minutos. Éste no, y no por nuestro código: **la v3 de `setup-swift` es una
    # BETA**. El único release v3 publicado es `v3.0.0-beta.1` (2025-11-30) y no
    # hay estable detrás.
    #
    # Y viene con un bug que rompe exactamente nuestros dos jobs de Swift:
    #
    #     swift-actions/setup-swift#798 — «gpg: Can't check signature: No
    #     public key» — ABIERTO desde 2025-12-02.
    #
    # Es el fallo textual del PR #927: `The process '/usr/bin/gpg' failed with
    # exit code 2`, en `Conformance (Swift)` y en `Watch capabilities y
    # permisos`. Los dos corren en `ubuntu-latest`, que no trae Swift, así que
    # la action no se puede simplemente sacar.
    #
    # Antes del #927 ya había pasado lo mismo dentro del #885 —el que motivó el
    # `update-types` de acá arriba—, así que van DOS PRs quemados en el mismo
    # upstream roto. Sin este ignore vuelve cada lunes.
    #
    # ── CUÁNDO SACAR ESTO ────────────────────────────────────────────────────
    #
    # Cuando `swift-actions/setup-swift` publique una v3 ESTABLE (no beta) y el
    # #798 esté cerrado. Chequeo de 30 segundos:
    #
    #     gh api repos/swift-actions/setup-swift/releases --jq '.[0].tag_name'
    #     gh api repos/swift-actions/setup-swift/issues/798 --jq .state
    #
    # Mientras tanto seguimos en el tag flotante `@v2`. OJO con un detalle que
    # se verificó el 2026-09-17 y que no es obvio: **`@v2` NO apunta a la última
    # v2.4.0** — el tag flotante quedó en `7591e4f0` y v2.4.0 es `7ca6abe6`. No
    # se toca porque el CI está verde con lo que hay, pero si algún día hace
    # falta algo de 2.4.0, se pinea la versión exacta y no se espera que `@v2`
    # la traiga sola.
    ignore:
      - dependency-name: 'swift-actions/setup-swift'
        update-types: ['version-update:semver-major']

  # ---------------------------------------------------------------------------
  # pub.dev — las 61 dependencias de pubspec.yaml.
  #
  # LOS VERSION UPDATES DE PUB ESTÁN APAGADOS: `open-pull-requests-limit: 0`.
  # Es la forma que documenta GitHub para apagar un package manager, y la única
  # que encontramos que no depende de cómo resuelve Dependabot. Motivo, abajo.
  #
  # OJO, ESTO NO ES ESCANEO DE VULNERABILIDADES, y hoy tampoco hay otro. Este
  # bloque decía que para pub no existían security updates ni alertas porque
  # pub.dev no estaba en la GitHub Advisory Database. Era falso: la base tiene
  # advisories de pub y GitHub lista security updates para pub. Lo que está
  # apagado son las alertas de ESTE repo, y sin ellas no hay security updates:
  #
  #     gh api '/advisories?ecosystem=pub&per_page=3' --jq '.[].ghsa_id'
  #     gh api repos/Backhaus7997/treino/vulnerability-alerts   # 404 = apagadas
  #
  # Medido el 2026-11-05. El límite de acá no toca security updates: tienen el
  # suyo, fijo (ver "Dependabot options reference").
  - package-ecosystem: pub
    # A main sólo entra develop (docs/workflow.md): los bumps también.
    target-branch: develop
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
    labels:
      - 'type:chore'
    groups:
      pub-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

    # `groups` e `ignore` quedan para el día que se reactive, y NINGUNO DE LOS DOS
    # FRENA LOS MAJORS DE PUB. Este comentario decía que `ignore` «corta antes».
    # Es falso: con este `ignore` en main desde el #925 (2026-09-02), los ocho PRs
    # agrupados siguientes trajeron majors directos (#930, #976, #1028, #1130,
    # #1181, #1373, #1430 y #1667). El último, de un grupo "minor-patch":
    #
    #     firebase_core ^3.6.0 -> ^5.1.0      cloud_firestore ^5.4.0 -> ^7.1.0
    #     firebase_auth ^5.3.1 -> ^7.0.1      freezed         ^2.5.7 -> ^4.0.3
    #
    # POR QUÉ. Los dos filtros de versión miran SÓLO la dependencia que Dependabot
    # está evaluando (la "líder"), comparando su `latest_version`. A los arrastrados
    # sólo los revisa `group_dependency_selector.rb`, y ahí descarta únicamente lo
    # ignorado del todo (`>= 0`), no por major. Leído en dependabot-core 450bd7af,
    # el HEAD del 2026-11-05 (el código que abrió los PRs viejos puede diferir):
    #
    #   1. firebase_app_check 0.3.2 -> 0.5.1 pasa los dos: el `ignore` de major
    #      sobre 0.3.2 es `>= 1.a`, y el grupo lo ve como minor.
    #   2. 0.5.1 pide firebase_core ^5.1.0, así que soltar sólo a la líder no
    #      resuelve (`requirements_to_unlock: :own`). Se reproduce:
    #          flutter pub add firebase_app_check:0.5.1 --dry-run
    #   3. Entonces pasa a `:all`: `updated_dependencies_after_full_unlock`
    #      devuelve TODO el `multiBreaking` directo, sin `version_unless_ignored`
    #      (pub/lib/dependabot/pub/update_checker.rb). Ahí entra firebase_core 5.
    #
    # La doc de GitHub no menciona este caso: "Dependabot supported ecosystems"
    # sólo dice que pub no actualiza si la versión a la que apunta está ignorada,
    # lo cual es cierto para la líder.
    # Cómo entró freezed o el prerelease de file_picker no se trazó paquete por
    # paquete; que el mecanismo sea éste es inferencia.
    #
    # LO QUE NO ARREGLA (leído en el código, no ejecutado: requiere Docker):
    #   - Sacar el grupo: `update_all_versions.rb` hace el mismo `:all`.
    #   - `versioning-strategy: lockfile-only`: pub no lo implementa. Su
    #     `resolve_requirements_update_strategy` hace `raise` con ese valor.
    #   - `ignore` por paquete: sin `versions` ni `update-types` también descarta
    #     al arrastrado, pero hay que listar a mano cada paquete, pierde sus
    #     minors, y deja sin cubrir al próximo que aparezca.
    #
    # QUÉ SE PIERDE: casi nada. De los 15 PRs de Dependabot que tocaron pubspec,
    # 13 agrupados se cerraron sin mergear y sólo entraron dos sueltos, previos
    # al `ignore` (#747 y #748, los dos majors). Los bumps de pub quedan a mano,
    # con la suite entera y prueba en device.
    #
    # CUÁNDO REACTIVAR: si dependabot-core filtra los arrastrados por `ignore`.
    # Hasta entonces, reactivar es volver a recibir estos PRs.
    #
    # OJO CON EL PREFIJO: adentro de `groups` los valores van pelados (`minor`,
    # `patch`) y adentro de `ignore` van con prefijo
    # (`version-update:semver-major`). No son intercambiables.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
