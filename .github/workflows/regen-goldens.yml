name: Regenerar goldens del gate visual

# Regenera los goldens del Coach Hub EN EL RUNNER y los commitea a la rama.
#
# ## Por que existe
#
# Es la mitad que le faltaba al corpus viejo. Un gate de goldens necesita dos
# cosas: detectar el cambio y dejar aceptarlo cuando es deliberado. Sin la
# segunda, el primer rediseño legítimo choca contra un rojo que nadie sabe
# desbloquear, y el gate se apaga.
#
# ## Por que en CI y no en tu maquina
#
# Los goldens son píxeles, y los píxeles dependen del rasterizador. CI corre
# ubuntu; los devs, macOS. Regenerar en la Mac produce PNG que NUNCA van a
# matchear el runner: distinto antialiasing de fuentes, distinto hinting. Y no
# es sólo el SO — hoy mismo el Flutter local del equipo (3.41.7) ya no es el
# que pinea CI (3.41.9).
#
# Así que la regeneración vive donde vive la verdad: acá.
#
# ## Como se dispara
#
#   git commit --allow-empty -m "chore(gate): regenerar goldens [regen-goldens]"
#   git push
#
# El marcador `[regen-goldens]` en el mensaje del commit prende este workflow.
# Se eligió así —y no sólo `workflow_dispatch`— porque GitHub únicamente
# ofrece el botón "Run workflow" para archivos que YA están en la rama default:
# en la rama donde nace el gate, ese botón todavía no existe. El marcador
# funciona desde el primer push.
#
# `workflow_dispatch` queda igual habilitado para cuando esto esté en `main`,
# que es la forma cómoda de usarlo después.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regen-goldens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regen:
    name: Regenerar y commitear goldens
    # En un push común este `if` es falso y el job ni arranca: sin marcador,
    # sin costo.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[regen-goldens]')
    runs-on: ubuntu-latest
    env:
      TREINO_VISUAL_GATE: '1'
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # El default de actions/checkout es un detached HEAD; sin el ref no
          # hay rama a la que pushear el commit de los PNG.
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Flutter
        # MISMA versión que el job `visual-gate` de ci.yml. Si divergen, este
        # workflow genera goldens que el gate rechaza — el peor de los mundos.
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerar goldens
        run: flutter test --update-goldens test/visual_gate/

      - name: Commitear los PNGs que cambiaron
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A test/visual_gate/goldens
          if git diff --cached --quiet; then
            echo "Ningun golden cambio. Nada que commitear."
            exit 0
          fi
          # La lista de archivos staged va al log del job a propósito: es el
          # registro de QUÉ se aceptó como baseline nuevo, y es lo que un
          # reviewer quiere ver cuando pregunta por qué cambió una imagen.
          #
          # `git diff --cached --name-status` y no `git status`: éste último no
          # tiene `--cached` y aborta con exit 129 (usage error), que con
          # `set -e` se lleva puesto el job entero — pasó en la primera corrida.
          git diff --cached --name-status
          # El mensaje del commit NO lleva el marcador, así que el push que
          # esto genera no vuelve a disparar este workflow: no hay bucle. Y SÍ
          # dispara ci.yml, que es lo que se quiere — el job `visual-gate`
          # valida los goldens recién nacidos contra el código actual.
          git commit -m "chore(gate): regenerar goldens del Coach Hub en el runner"
          git push origin HEAD

      - name: Subir los PNGs como artefacto
        # También cuando el commit no cambió nada: sirve para mirar el
        # resultado sin clonar la rama.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldens-coach-hub
          path: test/visual_gate/goldens/
          if-no-files-found: ignore
          retention-days: 14
