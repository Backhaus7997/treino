name: CI

# Corre en CADA PR (sea cual sea su base) y en cada push a main. El objetivo: que NINGÚN merge
# que no compile o que rompa tests pueda entrar a main (los breakages de #150 y
# #152/#153 habrían sido frenados acá).
#
# El filtro `branches: [main]` en pull_request se saco a proposito: con el, una
# cadena de PRs encadenados (cada uno con base en el anterior, convencion
# chained-pr) NO corria CI en ningun eslabon salvo el primero. La cadena entera
# llegaba sin verificar hasta el PR final contra main, y ahi se validaban miles
# de lineas de una sola vez — justo lo que la cadena venia a evitar. `push`
# sigue acotado a main, y el `concurrency` de abajo ya cancela runs viejos.
on:
  pull_request:
  push:
    branches: [main]

# Cancela runs viejos del mismo PR/branch para no gastar minutos al pedo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Fijado a la versión del entorno de desarrollo para reproducibilidad.
          # Si actualizan Flutter local, actualizá este número.
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Falla ante ERRORES (los args duplicados / marcadores de conflicto /
      # nombres indefinidos que se colaron a main por merges malos son errores).
      # Warnings/infos NO bloquean — hay deuda de lint pre-existente en el l10n
      # generado que no queremos que trabe todos los PRs.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # El gate duro: si el código no compila o falla algún test, el job falla
      # y (con branch protection activada) el PR NO se puede mergear.
      - name: Run tests
        run: flutter test

  # Conformidad Dart <-> Swift (change watch-standalone-client).
  #
  # El cliente watchOS no puede usar el SDK de Firestore, asi que reimplementa
  # en Swift logica que tambien vive en Dart. Esas dos copias VAN a divergir, y
  # cuando pase el historial de entrenamiento del usuario se corrompe EN
  # SILENCIO — nadie se entera hasta que los numeros no cierran.
  #
  # Los fixtures de conformance/*.json son el contrato. El lado Dart los corre
  # dentro de `flutter test`; este job corre el lado Swift contra los MISMOS
  # archivos. Sin este job los fixtures son decorativos, que es exactamente el
  # patron de "reglas testeadas pero nunca ejecutadas" que ya costo bugs acá.
  #
  # Corre en ubuntu (mucho mas barato que un runner macOS): el codigo bajo
  # prueba es una funcion pura que solo importa Foundation, disponible en el
  # Swift de Linux. Compila el archivo REAL del reloj, no una copia.
  conformance-swift:
    name: Conformance (Swift)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2

      - name: Run Swift conformance
        run: bash conformance/run_swift.sh

  # Capabilities y permisos del reloj (change watch-workout-session, F0).
  #
  # Una capability que se pierde de project.pbxproj NO rompe la compilacion: la
  # app sigue compilando, se instala y arranca, y el unico sintoma es HealthKit
  # negando todo en silencio en la muñeca del atleta. Y ese archivo lo
  # reescriben las herramientas —CocoaPods entero en cada `pod install`, el
  # paso de iOS de Flutter en cada build— no solo las personas. Este job
  # convierte esa perdida silenciosa en CI rojo.
  #
  # Corre en ubuntu igual que conformance-swift, y por la misma razon: lo que
  # se testea son archivos de texto commiteados y logica que solo importa
  # Foundation. Un runner macOS acá seria diez veces mas caro sin dar nada.
  watch-capabilities:
    name: Watch capabilities y permisos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2

      # Que el entitlement de HealthKit, su enganche a las TRES configuraciones
      # del target y los textos de permiso sigan en su lugar.
      - name: Capabilities del target watchOS
        run: bash scripts/test_watch_capabilities.sh

      # La logica de permisos, compilada contra el archivo REAL del reloj.
      - name: Logica de permisos de Salud
        run: bash scripts/test_watch_swift.sh

  # Gate de compilación para las Cloud Functions (functions/, Node 20 + TS).
  # Antes NADIE compilaba functions en CI: flutter analyze/test no ven functions/,
  # así que un error de tipos o de compilación en functions/src podía entrar a
  # main sin que nada lo frenara. Este job corre `tsc` y falla ante cualquiera.
  # Rápido y sin Java → feedback inmediato. Los tests (jest contra el Emulator
  # Suite) viven en el job `functions-test` de abajo.
  #
  # Además del build corre el typecheck de `scripts/` y el lint — los tres son
  # gates estáticos, baratos, y comparten el mismo `npm ci`. De ahí el nombre
  # "Functions Static Checks": se llamaba "Functions Build" cuando solo corría
  # `tsc`, y se renombró al sumar el tercero. Se hizo AHORA porque hoy `main`
  # no tiene branch protection ni rulesets —cero required status checks, o sea
  # que el rename no deja nada huérfano— y el día que se los pongan van a
  # referenciar este nombre y renombrarlo pasa a costar.
  #
  # La CLAVE del job sigue siendo `functions-build` a propósito, aunque no
  # coincida con el nombre: no es visible en la lista de checks, nada le hace
  # `needs:`, y está citada en artefactos SDD ya archivados
  # (openspec/changes/follow-model/). Cambiarla obligaría a reescribir
  # documentos históricos para acomodar un rename cosmético.
  functions-build:
    name: Functions Static Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # Instala exactamente lo del lockfile (reproducible, igual que en local).
      - name: Install functions dependencies
        run: npm --prefix functions ci

      - name: Build functions (tsc)
        run: npm --prefix functions run build

      # Los scripts one-off de `functions/scripts/` NO entran en `tsconfig.json`
      # —que incluye solo `src`— asi que el build de arriba pasaba en verde sin
      # mirarlos. Uno llevaba semanas sin compilar: importaba un modulo borrado
      # al desacoplar cobros, y nadie se entero porque nada lo compilaba.
      - name: Typecheck functions scripts
        run: npm --prefix functions run typecheck:scripts

      # El tercer agujero de la misma familia que los dos de arriba: el script
      # `lint` existía en package.json, estaba roto de punta a punta —76 parsing
      # errors, uno por cada archivo de src/__tests__/— y ningún job lo corría,
      # así que nadie se enteraba. Arreglado en el PR que agrega este paso
      # (functions/tsconfig.eslint.json). Se corre acá y no en un job aparte
      # porque `functions-build` ya tiene Node 20 y las deps instaladas: sumarlo
      # cuesta segundos, un job nuevo cuesta otro `npm ci` entero.
      #
      # Va DESPUÉS de build y typecheck a propósito: si el código no compila,
      # los hallazgos del lint —que es typed, usa type information— son ruido
      # derivado. Primero "¿compila?", después "¿está bien escrito?".
      #
      # Gatea sobre ERRORES, no sobre warnings: hoy quedan 10 `max-len` vivos y
      # limpiarlos es otra discusión. Si algún día se quieren gatear, el flag es
      # `--max-warnings 0` y hay que barrerlos antes o esto se pone rojo.
      - name: Lint functions
        run: npm --prefix functions run lint

  # Corre los tests de las Cloud Functions (jest) contra el Firebase Emulator
  # Suite. Era el agujero que faltaba: hasta ahora los tests de functions/ —
  # incluidos los de reglas de seguridad, que nunca se ejecutaron en CI (ver
  # #360) — no corrían nunca. Requisitos: Java 21+ (lo exige el Emulator Suite
  # de firebase-tools 15+) y el CLI de firebase.
  #
  # OJO: este job cubre `functions/src/__tests__/` y NADA MÁS. El testMatch de
  # functions/jest.config.js es `**/src/__tests__/**/*.test.ts`, así que la
  # segunda suite de reglas —los .js de scripts/rules_test/— quedaba afuera.
  # La corre el job `rules-test` de abajo (#680 Slice B).
  #
  # Una sola pasada `emulators:exec --only firestore,auth "npm test"` replica el
  # flujo documentado en functions/README.md: emulador con el project default
  # `treino-dev` (.firebaserc) + `npm test`. Los tests de reglas usan sus propios
  # projectIds vía @firebase/rules-unit-testing y conviven en el mismo emulador
  # (mismo esquema que corren los devs en local). El emulador NO necesita login.
  functions-test:
    name: Functions Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # El Emulator Suite de firebase-tools 15+ no arranca sin Java 21+.
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install functions dependencies
        run: npm --prefix functions ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Levanta firestore + auth + storage, corre TODO el suite (unit +
      # emulator-backed + rules) y baja el emulador. Dos detalles no obvios:
      #   - storage: cascade/storage y delete-account borran objetos del emulador
      #     de Storage (puerto 9199); sin él tiran ECONNREFUSED y timeouts.
      #   - --runInBand: 3 suites de reglas comparten el projectId
      #     "treino-rules-test" y hacen clearFirestore() en afterEach; corriendo
      #     en paralelo se pisan los datos entre sí (PERMISSION_DENIED
      #     intermitente en tests de transición). Serial las aísla. El script
      #     `test` ya trae --forceExit.
      - name: Run functions tests against the emulator
        run: firebase emulators:exec --only firestore,auth,storage "npm --prefix functions test -- --runInBand"

  # La SEGUNDA suite de reglas: scripts/rules_test/*.test.js (#680 Slice B).
  #
  # Hay dos suites de reglas en el repo y hasta acá sólo una corría sola. Las
  # de functions/ las levanta `functions-test`; estos 8 archivos son .js y
  # viven fuera del `testMatch` de functions/jest.config.js
  # (`**/src/__tests__/**/*.test.ts`), así que ningún job los tocaba. Su única
  # ejecución era que alguien se acordara de correr `bash scripts/test_rules.sh`
  # antes de mergear.
  #
  # Cuánto cuesta ese "que alguien se acuerde": al meterlos acá, la suite
  # estaba ROJA. Cuatro aserciones de rules.test.js habían quedado obsoletas
  # contra cambios deliberados de las reglas y nadie se enteró — la más vieja
  # (SCENARIO-608a, el widening de UPDATE path 2 en routines) llevaba desde el
  # 2026-06-09. Ninguna era un agujero de seguridad; el problema es que la
  # suite no podía distinguir entre "regla que cambió a propósito" y "regla que
  # se rompió", porque nadie la miraba. Eso es exactamente lo que un gate
  # arregla y un checklist no.
  #
  # Es un job aparte y no un paso más de `functions-test` por dos razones
  # concretas: (1) tiene su propio árbol de dependencias — package.json y
  # lockfile propios en scripts/rules_test/, que se instalan y versionan
  # aparte de los de functions/ aunque compartan dependencias como
  # @firebase/rules-unit-testing — y (2) corriendo en paralelo el rojo se
  # atribuye solo, sin abrir el log a ver cuál de las dos suites cayó.
  #
  # Es un gate duro igual que el resto: falla el job y (con branch protection
  # activada) el PR no se puede mergear. OJO que hoy `main` NO tiene branch
  # protection, así que en la práctica ningún job frena nada todavía — ver la
  # nota en docs/security.md §1. Se mergea en verde igual (8 suites / 139
  # tests) y los dos negativos nuevos se verificaron por mutación, no sólo por
  # verde — ver docs/security.md §1.8.
  rules-test:
    name: Rules Test (scripts/rules_test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: scripts/rules_test/package-lock.json

      # El Emulator Suite de firebase-tools 15+ no arranca sin Java 21+.
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install rules test dependencies
        run: npm --prefix scripts/rules_test ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Se invoca el script REAL, no una copia de su comando. Si mañana la
      # suite necesita otro emulador o otro flag, el dev lo cambia en un solo
      # lugar y CI lo hereda; una línea `run:` duplicada acá sería la próxima
      # cosa que se desincroniza en silencio. El script ya trae --runInBand
      # (6 de los 8 archivos comparten el projectId "treino-test-rules" y hacen
      # clearFirestore() en afterEach) y levanta y baja su propio emulador.
      - name: Run rules test suite
        run: bash scripts/test_rules.sh
