name: CI

# Corre en CADA PR (sea cual sea su base) y en cada push a main. El objetivo: que NINGÚN merge
# que no compile o que rompa tests pueda entrar a main (los breakages de #150 y
# #152/#153 habrían sido frenados acá).
#
# El filtro `branches: [main]` en pull_request se saco a proposito: con el, una
# cadena de PRs encadenados (cada uno con base en el anterior, convencion
# chained-pr) NO corria CI en ningun eslabon salvo el primero. La cadena entera
# llegaba sin verificar hasta el PR final contra main, y ahi se validaban miles
# de lineas de una sola vez — justo lo que la cadena venia a evitar. `push`
# sigue acotado a main, y el `concurrency` de abajo ya cancela runs viejos.
on:
  pull_request:
  push:
    branches: [main]

# Cancela runs viejos del mismo PR/branch para no gastar minutos al pedo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Fijado a la versión del entorno de desarrollo para reproducibilidad.
          # Si actualizan Flutter local, actualizá este número.
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Falla ante ERRORES (los args duplicados / marcadores de conflicto /
      # nombres indefinidos que se colaron a main por merges malos son errores).
      # Warnings/infos NO bloquean — hay deuda de lint pre-existente en el l10n
      # generado que no queremos que trabe todos los PRs.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # El gate duro: si el código no compila o falla algún test, el job falla
      # y (con branch protection activada) el PR NO se puede mergear.
      - name: Run tests
        run: flutter test

  # Conformidad Dart <-> Swift (change watch-standalone-client).
  #
  # El cliente watchOS no puede usar el SDK de Firestore, asi que reimplementa
  # en Swift logica que tambien vive en Dart. Esas dos copias VAN a divergir, y
  # cuando pase el historial de entrenamiento del usuario se corrompe EN
  # SILENCIO — nadie se entera hasta que los numeros no cierran.
  #
  # Los fixtures de conformance/*.json son el contrato. El lado Dart los corre
  # dentro de `flutter test`; este job corre el lado Swift contra los MISMOS
  # archivos. Sin este job los fixtures son decorativos, que es exactamente el
  # patron de "reglas testeadas pero nunca ejecutadas" que ya costo bugs acá.
  #
  # Corre en ubuntu (mucho mas barato que un runner macOS): el codigo bajo
  # prueba es una funcion pura que solo importa Foundation, disponible en el
  # Swift de Linux. Compila el archivo REAL del reloj, no una copia.
  conformance-swift:
    name: Conformance (Swift)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2

      - name: Run Swift conformance
        run: bash conformance/run_swift.sh

  # Capabilities y permisos del reloj (change watch-workout-session, F0).
  #
  # Una capability que se pierde de project.pbxproj NO rompe la compilacion: la
  # app sigue compilando, se instala y arranca, y el unico sintoma es HealthKit
  # negando todo en silencio en la muñeca del atleta. Y ese archivo lo
  # reescriben las herramientas —CocoaPods entero en cada `pod install`, el
  # paso de iOS de Flutter en cada build— no solo las personas. Este job
  # convierte esa perdida silenciosa en CI rojo.
  #
  # Corre en ubuntu igual que conformance-swift, y por la misma razon: lo que
  # se testea son archivos de texto commiteados y logica que solo importa
  # Foundation. Un runner macOS acá seria diez veces mas caro sin dar nada.
  watch-capabilities:
    name: Watch capabilities y permisos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2

      # Que el entitlement de HealthKit, su enganche a las TRES configuraciones
      # del target y los textos de permiso sigan en su lugar.
      - name: Capabilities del target watchOS
        run: bash scripts/test_watch_capabilities.sh

      # La logica de permisos, compilada contra el archivo REAL del reloj.
      - name: Logica de permisos de Salud
        run: bash scripts/test_watch_swift.sh

  # Gate de compilación para las Cloud Functions (functions/, Node 20 + TS).
  # Antes NADIE compilaba functions en CI: flutter analyze/test no ven functions/,
  # así que un error de tipos o de compilación en functions/src podía entrar a
  # main sin que nada lo frenara. Este job corre `tsc` y falla ante cualquiera.
  # Rápido y sin Java → feedback inmediato. Los tests (jest contra el Emulator
  # Suite) viven en el job `functions-test` de abajo.
  functions-build:
    name: Functions Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # Instala exactamente lo del lockfile (reproducible, igual que en local).
      - name: Install functions dependencies
        run: npm --prefix functions ci

      - name: Build functions (tsc)
        run: npm --prefix functions run build

      # Los scripts one-off de `functions/scripts/` NO entran en `tsconfig.json`
      # —que incluye solo `src`— asi que el build de arriba pasaba en verde sin
      # mirarlos. Uno llevaba semanas sin compilar: importaba un modulo borrado
      # al desacoplar cobros, y nadie se entero porque nada lo compilaba.
      - name: Typecheck functions scripts
        run: npm --prefix functions run typecheck:scripts

  # Corre los tests de las Cloud Functions (jest) contra el Firebase Emulator
  # Suite. Era el agujero que faltaba: hasta ahora los tests de functions/ —
  # incluidos los de reglas de seguridad, que nunca se ejecutaron en CI (ver
  # #360) — no corrían nunca. Requisitos: Java 21+ (lo exige el Emulator Suite
  # de firebase-tools 15+) y el CLI de firebase.
  #
  # Una sola pasada `emulators:exec --only firestore,auth "npm test"` replica el
  # flujo documentado en functions/README.md: emulador con el project default
  # `treino-dev` (.firebaserc) + `npm test`. Los tests de reglas usan sus propios
  # projectIds vía @firebase/rules-unit-testing y conviven en el mismo emulador
  # (mismo esquema que corren los devs en local). El emulador NO necesita login.
  functions-test:
    name: Functions Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # El Emulator Suite de firebase-tools 15+ no arranca sin Java 21+.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install functions dependencies
        run: npm --prefix functions ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Levanta firestore + auth + storage, corre TODO el suite (unit +
      # emulator-backed + rules) y baja el emulador. Dos detalles no obvios:
      #   - storage: cascade/storage y delete-account borran objetos del emulador
      #     de Storage (puerto 9199); sin él tiran ECONNREFUSED y timeouts.
      #   - --runInBand: 3 suites de reglas comparten el projectId
      #     "treino-rules-test" y hacen clearFirestore() en afterEach; corriendo
      #     en paralelo se pisan los datos entre sí (PERMISSION_DENIED
      #     intermitente en tests de transición). Serial las aísla. El script
      #     `test` ya trae --forceExit.
      - name: Run functions tests against the emulator
        run: firebase emulators:exec --only firestore,auth,storage "npm --prefix functions test -- --runInBand"
