name: CI

# Corre en CADA PR (sea cual sea su base) y en cada push a main. El objetivo: que NINGÚN merge
# que no compile o que rompa tests pueda entrar a main (los breakages de #150 y
# #152/#153 habrían sido frenados acá).
#
# El filtro `branches: [main]` en pull_request se saco a proposito: con el, una
# cadena de PRs encadenados (cada uno con base en el anterior, convencion
# chained-pr) NO corria CI en ningun eslabon salvo el primero. La cadena entera
# llegaba sin verificar hasta el PR final contra main, y ahi se validaban miles
# de lineas de una sola vez — justo lo que la cadena venia a evitar. `push`
# sigue acotado a main, y el `concurrency` de abajo ya cancela runs viejos.
on:
  pull_request:
  push:
    branches: [main]

# Cancela runs viejos del mismo PR/branch para no gastar minutos al pedo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # El fix de #840 vive en UN valor de UN archivo: el `default` de `.firebaserc`.
  # `treino-dev` es PRODUCCION, y mientras fue el default cualquier `deploy` o
  # `firestore:delete` sin `--project` llegaba a datos de usuarios reales. Ahora
  # es `demo-treino`, que Firebase trata como proyecto offline del emulador.
  #
  # Un merge mal resuelto, un `firebase use --add` que reescribe el bloque, o un
  # revert distraido lo deshacen sin que nada chille: el archivo sigue siendo
  # JSON valido, todo compila, todos los tests pasan, y el sintoma recien aparece
  # el dia que alguien corre algo destructivo. Este job es el unico lugar donde
  # ese silencio se vuelve rojo. Va PRIMERO y sin toolchain (solo checkout +
  # bash) para que falle en segundos.
  #
  # Cubre la mitad VERSIONADA del agujero. El pin de `firebase use` vive en
  # `~/.config/configstore/` de cada maquina, le gana al default y se hereda de
  # los directorios padre: CI no lo ve. Para esa mitad hay
  # `scripts/sync_firebaserc_worktrees.sh`.
  firebaserc-default:
    name: .firebaserc default no apunta a produccion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: El default de .firebaserc tiene que ser un proyecto demo-
        run: bash scripts/check_firebaserc_default.sh

  # `Analyze & Test` era UN job con dos pasos, y el segundo paso ERA el CI:
  # medido sobre `main` en el run 33527262247, el paso `Run tests` tarda 820 s
  # (13:40) sobre un job de 908 s (15:08), mientras que los otros OCHO jobs del
  # workflow cierran todos juntos en menos de 4 minutos. Nadie espera por
  # `analyze` (47 s) ni por las reglas de Firestore: se espera por los tests.
  #
  # Partido en dos: `analyze` solo —meterlo adentro de la matrix lo haría correr
  # 4 veces para decir lo mismo 4 veces— y `test` repartido en shards.
  #
  # `fail-fast: false` es deliberado: con el default de GitHub, el primer shard
  # en rojo cancela los otros tres y el reporte queda contando media suite. Un
  # PR que rompe dos áreas tiene que mostrar las dos en la misma corrida, o el
  # fix se hace de a una y se pagan dos vueltas de CI.
  #
  # ── POR QUÉ SE REPARTEN ARCHIVOS Y NO TESTS ─────────────────────────────────
  #
  # `flutter test --total-shards/--shard-index` existe y es más corto de
  # escribir. Se probó primero, se midió en CI, y se descartó por DOS motivos.
  #
  # 1. No divide lo que hay que dividir. Esos flags reparten los TESTS, pero
  #    cada shard igual tiene que CARGAR los 720 archivos, porque cualquiera
  #    puede tener un test que le tocó. Con dos puntos medidos —820 s la suite
  #    entera, 619 s el shard más lento de cuatro— se despeja el modelo:
  #
  #        F + V = 820   ;   F + V/4 = 619   ->   F = 552 s
  #
  #    El 67% del costo es compilar, y ese piso no se perfora: con 8 shards da
  #    586 s, con infinitos da 552. El techo era ~11 min. Repartiendo ARCHIVOS
  #    se divide también la compilación: medido sobre test/features/workout,
  #    164 archivos tardan 108 s y 41 tardan 16 s — 6,75x, mejor que la división
  #    perfecta, porque un set chico de compilación también tiene menos overhead.
  #
  # 2. Cambia la semántica de la suite EN SILENCIO. Repartir por test separa
  #    tests que viven en el mismo archivo, y ahí aparecen los que nunca fueron
  #    independientes. `test/app/router_navbar_collapse_test.dart` tiene 4
  #    tests: juntos pasan, el cuarto SOLO explota con `debugSize == size` en
  #    text_painter. La causa está documentada en test/visual_gate/gate_fonts.dart
  #    —`google_fonts` registra cada variante recién cuando alguien la pide, y de
  #    forma asincrónica—: el primer test del archivo se come la carrera y los
  #    demás heredan el registro tibio. Repartiendo archivos enteros eso no puede
  #    pasar: nadie se separa de sus hermanos de archivo.
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Fijado a la versión del entorno de desarrollo para reproducibilidad.
          # Si actualizan Flutter local, actualizá este número.
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Falla ante ERRORES (los args duplicados / marcadores de conflicto /
      # nombres indefinidos que se colaron a main por merges malos son errores).
      # Warnings/infos NO bloquean — hay deuda de lint pre-existente en el l10n
      # generado que no queremos que trabe todos los PRs.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

  test:
    name: Test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Esta lista es el NÚMERO de shards. Los valores son 0-based a propósito:
        # coinciden con el `--shard-index` de cada job, así que un
        # "Test (shard 2)" en rojo se reproduce local con el mismo 2.
        #
        # Los valores NO alimentan el reparto: eso sale de `strategy.job-*`, que
        # GitHub deriva del largo de esta lista. Agregar una entrada reparte la
        # suite sola, sin ningún total escrito a mano que se pueda desincronizar.
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        # MISMA versión que `analyze` y que `visual-gate`. Ver el comentario del
        # gate visual acá abajo: los goldens están atados a esta rasterización.
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # El gate duro: si el código no compila o falla algún test, el job falla
      # y (con branch protection activada) el PR NO se puede mergear.
      #
      # Acá nos hacemos cargo del descubrimiento de tests, que es la parte cara
      # de este enfoque: si la lista sale corta, hay tests que no corren y el
      # job igual da VERDE. Ese es el peor modo de falla que puede tener un
      # gate, así que la lista se arma dos veces por caminos independientes
      # —el filesystem y el índice de git— y tienen que coincidir exactamente.
      # Un `*_test.dart` sin trackear, o un patrón mal escrito, separa las dos
      # listas y el job frena acá en vez de mentir en verde.
      #
      # El reparto en sí no necesita guard: `NR % total == index` le asigna a
      # cada línea exactamente un residuo, así que los shards son una partición
      # por construcción. Lo único que puede estar mal es la lista de entrada,
      # y de eso se ocupa el diff de arriba.
      - name: Run tests
        # Los índices entran por `env:` y no interpolados adentro del script.
        # `${{ }}` dentro de un `run:` lo sustituye GitHub ANTES de que bash vea
        # la línea: acá los valores son enteros del propio contexto `strategy`,
        # pero el patrón es el mismo que convierte el título de un PR en código
        # ejecutable, y no vale la pena tenerlo escrito como ejemplo a copiar.
        env:
          SHARD_TOTAL: ${{ strategy.job-total }}
          SHARD_INDEX: ${{ strategy.job-index }}
        run: |
          set -euo pipefail

          find test -name '*_test.dart' -type f | sort > /tmp/tests-fs.txt
          git ls-files 'test/**/*_test.dart' | sort > /tmp/tests-git.txt

          if ! diff -q /tmp/tests-fs.txt /tmp/tests-git.txt > /dev/null; then
            echo "::error::La lista de tests no coincide entre el filesystem y git."
            echo "::error::Con listas distintas no se puede garantizar que la suite corra entera."
            diff /tmp/tests-git.txt /tmp/tests-fs.txt || true
            exit 1
          fi

          TOTAL_FILES=$(wc -l < /tmp/tests-fs.txt)
          if [ "$TOTAL_FILES" -eq 0 ]; then
            echo "::error::No se encontró ningún archivo *_test.dart. Falla en vez de pasar en verde vacío."
            exit 1
          fi

          # Lectura portable a array. NO se usa `mapfile`: el runner tiene bash 5
          # y lo soportaría, pero macOS sigue trayendo bash 3.2.57 y ahí no
          # existe. Con `mapfile` el comando de este job no se puede pegar en la
          # terminal de un dev para reproducir un shard rojo, que es medio punto
          # de que el índice del shard esté en el nombre del job.
          FILES=()
          while IFS= read -r f; do FILES+=("$f"); done \
            < <(awk -v t="$SHARD_TOTAL" -v i="$SHARD_INDEX" 'NR % t == i' /tmp/tests-fs.txt)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::Este shard quedó sin archivos. Hay más shards que tests, o la lista se rompió."
            exit 1
          fi

          echo "shard $SHARD_INDEX/$SHARD_TOTAL: ${#FILES[@]} de $TOTAL_FILES archivos"
          flutter test "${FILES[@]}"

  # Gate de regresion visual del Coach Hub (#761).
  #
  # Job APARTE, y no un paso de "Analyze & Test", por dos motivos:
  #
  # 1. Corre con TREINO_VISUAL_GATE=1. Sin esa variable la suite de
  #    test/visual_gate/ se saltea, asi que `flutter test` a secas —el que
  #    corren los devs en su Mac— nunca la ejecuta. Eso es deliberado: los
  #    goldens estan rasterizados por ESTE runner. Correrlos en macOS da
  #    rojo por antialiasing, y un gate que falla donde no se puede arreglar
  #    dura hasta que alguien lo apaga. Ver docs/visual-gate.md.
  #
  # 2. Cuando rompe, el diff es una imagen. Job propio = artefacto propio:
  #    el reviewer se baja las tres imagenes (esperada / real / mascara del
  #    diff) sin bucear en un log de miles de lineas.
  #
  # TZ=UTC no es cosmetico. El seed congela el reloj en un DateTime local; si
  # el runner no estuviera en UTC, argentinaNow() —que hace .toUtc() sobre ese
  # instante— rendiria otra hora y las pantallas con horarios cambiarian de
  # pixeles sin que nadie tocara la UI. El job lo fija y el propio gate lo
  # verifica en un test con nombre ("el entorno del gate esta pinneado").
  #
  # ESTE JOB ES BLOQUEANTE. Hoy `main` no tiene branch protection
  # (/branches/main/protection -> 404), asi que en rojo NO impide mergear: hay
  # que mirarlo. Cuando se active la proteccion, este check va a la lista de
  # obligatorios — sin eso el gate avisa pero no frena, que es exactamente el
  # corpus que #723 borro con otro nombre.
  visual-gate:
    name: Visual Gate (Coach Hub)
    runs-on: ubuntu-latest
    env:
      TREINO_VISUAL_GATE: '1'
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        # MISMA versión que `analyze` y `test`. Si se mueve una, se mueven
        # las otras: los goldens están atados a esta rasterización.
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Gate de regresion visual
        run: flutter test test/visual_gate/

      - name: Subir los diffs de imagen si el gate rompio
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-gate-failures
          path: test/visual_gate/failures/
          if-no-files-found: ignore
          retention-days: 14

  # Conformidad Dart <-> Swift (change watch-standalone-client).
  #
  # El cliente watchOS no puede usar el SDK de Firestore, asi que reimplementa
  # en Swift logica que tambien vive en Dart. Esas dos copias VAN a divergir, y
  # cuando pase el historial de entrenamiento del usuario se corrompe EN
  # SILENCIO — nadie se entera hasta que los numeros no cierran.
  #
  # Los fixtures de conformance/*.json son el contrato. El lado Dart los corre
  # dentro de `flutter test`; este job corre el lado Swift contra los MISMOS
  # archivos. Sin este job los fixtures son decorativos, que es exactamente el
  # patron de "reglas testeadas pero nunca ejecutadas" que ya costo bugs acá.
  #
  # Corre en ubuntu (mucho mas barato que un runner macOS): el codigo bajo
  # prueba es una funcion pura que solo importa Foundation, disponible en el
  # Swift de Linux. Compila el archivo REAL del reloj, no una copia.
  conformance-swift:
    name: Conformance (Swift)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2

      - name: Run Swift conformance
        run: bash conformance/run_swift.sh

  # Capabilities y permisos del reloj (change watch-workout-session, F0).
  #
  # Una capability que se pierde de project.pbxproj NO rompe la compilacion: la
  # app sigue compilando, se instala y arranca, y el unico sintoma es HealthKit
  # negando todo en silencio en la muñeca del atleta. Y ese archivo lo
  # reescriben las herramientas —CocoaPods entero en cada `pod install`, el
  # paso de iOS de Flutter en cada build— no solo las personas. Este job
  # convierte esa perdida silenciosa en CI rojo.
  #
  # Corre en ubuntu igual que conformance-swift, y por la misma razon: lo que
  # se testea son archivos de texto commiteados y logica que solo importa
  # Foundation. Un runner macOS acá seria diez veces mas caro sin dar nada.
  watch-capabilities:
    name: Watch capabilities y permisos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2

      # Que el entitlement de HealthKit, su enganche a las TRES configuraciones
      # del target y los textos de permiso sigan en su lugar.
      - name: Capabilities del target watchOS
        run: bash scripts/test_watch_capabilities.sh

      # La logica de permisos, compilada contra el archivo REAL del reloj.
      - name: Logica de permisos de Salud
        run: bash scripts/test_watch_swift.sh

  # Gate de compilación para las Cloud Functions (functions/, Node 20 + TS).
  # Antes NADIE compilaba functions en CI: flutter analyze/test no ven functions/,
  # así que un error de tipos o de compilación en functions/src podía entrar a
  # main sin que nada lo frenara. Este job corre `tsc` y falla ante cualquiera.
  # Rápido y sin Java → feedback inmediato. Los tests (jest contra el Emulator
  # Suite) viven en el job `functions-test` de abajo.
  #
  # Además del build corre el typecheck de `scripts/` y el lint — los tres son
  # gates estáticos, baratos, y comparten el mismo `npm ci`. De ahí el nombre
  # "Functions Static Checks": se llamaba "Functions Build" cuando solo corría
  # `tsc`, y se renombró al sumar el tercero. Se hizo AHORA porque hoy `main`
  # no tiene branch protection ni rulesets —cero required status checks, o sea
  # que el rename no deja nada huérfano— y el día que se los pongan van a
  # referenciar este nombre y renombrarlo pasa a costar.
  #
  # La CLAVE del job sigue siendo `functions-build` a propósito, aunque no
  # coincida con el nombre: no es visible en la lista de checks, nada le hace
  # `needs:`, y está citada en artefactos SDD ya archivados
  # (openspec/changes/follow-model/). Cambiarla obligaría a reescribir
  # documentos históricos para acomodar un rename cosmético.
  functions-build:
    name: Functions Static Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # Instala exactamente lo del lockfile (reproducible, igual que en local).
      - name: Install functions dependencies
        run: npm --prefix functions ci

      - name: Build functions (tsc)
        run: npm --prefix functions run build

      # Los scripts one-off de `functions/scripts/` NO entran en `tsconfig.json`
      # —que incluye solo `src`— asi que el build de arriba pasaba en verde sin
      # mirarlos. Uno llevaba semanas sin compilar: importaba un modulo borrado
      # al desacoplar cobros, y nadie se entero porque nada lo compilaba.
      - name: Typecheck functions scripts
        run: npm --prefix functions run typecheck:scripts

      # El tercer agujero de la misma familia que los dos de arriba: el script
      # `lint` existía en package.json, estaba roto de punta a punta —76 parsing
      # errors, uno por cada archivo de src/__tests__/— y ningún job lo corría,
      # así que nadie se enteraba. Arreglado en el PR que agrega este paso
      # (functions/tsconfig.eslint.json). Se corre acá y no en un job aparte
      # porque `functions-build` ya tiene Node 20 y las deps instaladas: sumarlo
      # cuesta segundos, un job nuevo cuesta otro `npm ci` entero.
      #
      # Va DESPUÉS de build y typecheck a propósito: si el código no compila,
      # los hallazgos del lint —que es typed, usa type information— son ruido
      # derivado. Primero "¿compila?", después "¿está bien escrito?".
      #
      # Gatea sobre ERRORES, no sobre warnings: hoy quedan 10 `max-len` vivos y
      # limpiarlos es otra discusión. Si algún día se quieren gatear, el flag es
      # `--max-warnings 0` y hay que barrerlos antes o esto se pone rojo.
      - name: Lint functions
        run: npm --prefix functions run lint

  # Corre los tests de las Cloud Functions (jest) contra el Firebase Emulator
  # Suite. Era el agujero que faltaba: hasta ahora los tests de functions/ —
  # incluidos los de reglas de seguridad, que nunca se ejecutaron en CI (ver
  # #360) — no corrían nunca. Requisitos: Java 21+ (lo exige el Emulator Suite
  # de firebase-tools 15+) y el CLI de firebase.
  #
  # OJO: este job cubre `functions/src/__tests__/` y NADA MÁS. El testMatch de
  # functions/jest.config.js es `**/src/__tests__/**/*.test.ts`, así que la
  # segunda suite de reglas —los .js de scripts/rules_test/— quedaba afuera.
  # La corre el job `rules-test` de abajo (#680 Slice B).
  #
  # Una sola pasada `emulators:exec --only firestore,auth "npm test"` replica el
  # flujo documentado en functions/README.md: emulador con el project
  # `treino-dev` + `npm test`. Los tests de reglas usan sus propios projectIds
  # vía @firebase/rules-unit-testing y conviven en el mismo emulador (mismo
  # esquema que corren los devs en local). El emulador NO necesita login.
  #
  # El `--project treino-dev` del step es de #840 y antes era implícito: se
  # resolvía por el default de `.firebaserc`, que ahora es `demo-treino` — un id
  # que Firebase trata como proyecto offline del emulador, puesto justamente
  # para que un `deploy` sin `--project` no llegue a producción desde ninguno de
  # los ~27 worktrees del repo.
  #
  # Honestidad sobre cuánto pesa el flag ACÁ, porque se midió en local: sin él
  # este job igual da verde (95 suites / 1391 tests), porque
  # `session-feedback-storage-rules.test.ts` lee su projectId de GCLOUD_PROJECT
  # en vez de hardcodearlo y se adapta solo. Lo que sí cambia es el ruido: 173
  # warnings de `Multiple projectIds are not recommended in single project mode`
  # contra 0, uno por cada suite que pide `treino-dev` mientras el emulador está
  # configurado para otro proyecto. El flag está para que ese desacople no
  # exista, no para tapar un rojo. Donde el id SÍ decide verde/rojo es en el job
  # `rules-test` de abajo (ver scripts/test_rules.sh).
  functions-test:
    name: Functions Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # El Emulator Suite de firebase-tools 15+ no arranca sin Java 21+.
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install functions dependencies
        run: npm --prefix functions ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Levanta firestore + auth + storage, corre TODO el suite (unit +
      # emulator-backed + rules) y baja el emulador. Dos detalles no obvios:
      #   - storage: cascade/storage y delete-account borran objetos del emulador
      #     de Storage (puerto 9199); sin él tiran ECONNREFUSED y timeouts.
      #   - --runInBand: 3 suites de reglas comparten el projectId
      #     "treino-rules-test" y hacen clearFirestore() en afterEach; corriendo
      #     en paralelo se pisan los datos entre sí (PERMISSION_DENIED
      #     intermitente en tests de transición). Serial las aísla. El script
      #     `test` ya trae --forceExit.
      - name: Run functions tests against the emulator
        run: firebase emulators:exec --only firestore,auth,storage --project treino-dev "npm --prefix functions test -- --runInBand"

  # La SEGUNDA suite de reglas: scripts/rules_test/*.test.js (#680 Slice B).
  #
  # Hay dos suites de reglas en el repo y hasta acá sólo una corría sola. Las
  # de functions/ las levanta `functions-test`; estos 8 archivos son .js y
  # viven fuera del `testMatch` de functions/jest.config.js
  # (`**/src/__tests__/**/*.test.ts`), así que ningún job los tocaba. Su única
  # ejecución era que alguien se acordara de correr `bash scripts/test_rules.sh`
  # antes de mergear.
  #
  # Cuánto cuesta ese "que alguien se acuerde": al meterlos acá, la suite
  # estaba ROJA. Cuatro aserciones de rules.test.js habían quedado obsoletas
  # contra cambios deliberados de las reglas y nadie se enteró — la más vieja
  # (SCENARIO-608a, el widening de UPDATE path 2 en routines) llevaba desde el
  # 2026-06-09. Ninguna era un agujero de seguridad; el problema es que la
  # suite no podía distinguir entre "regla que cambió a propósito" y "regla que
  # se rompió", porque nadie la miraba. Eso es exactamente lo que un gate
  # arregla y un checklist no.
  #
  # Es un job aparte y no un paso más de `functions-test` por dos razones
  # concretas: (1) tiene su propio árbol de dependencias — package.json y
  # lockfile propios en scripts/rules_test/, que se instalan y versionan
  # aparte de los de functions/ aunque compartan dependencias como
  # @firebase/rules-unit-testing — y (2) corriendo en paralelo el rojo se
  # atribuye solo, sin abrir el log a ver cuál de las dos suites cayó.
  #
  # Es un gate duro igual que el resto: falla el job y (con branch protection
  # activada) el PR no se puede mergear. OJO que hoy `main` NO tiene branch
  # protection, así que en la práctica ningún job frena nada todavía — ver la
  # nota en docs/security.md §1. Se mergea en verde igual (8 suites / 139
  # tests) y los dos negativos nuevos se verificaron por mutación, no sólo por
  # verde — ver docs/security.md §1.8.
  rules-test:
    name: Rules Test (scripts/rules_test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: scripts/rules_test/package-lock.json

      # El Emulator Suite de firebase-tools 15+ no arranca sin Java 21+.
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install rules test dependencies
        run: npm --prefix scripts/rules_test ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Se invoca el script REAL, no una copia de su comando. Si mañana la
      # suite necesita otro emulador o otro flag, el dev lo cambia en un solo
      # lugar y CI lo hereda; una línea `run:` duplicada acá sería la próxima
      # cosa que se desincroniza en silencio. El script ya trae --runInBand
      # (6 de los 8 archivos comparten el projectId "treino-test-rules" y hacen
      # clearFirestore() en afterEach) y levanta y baja su propio emulador.
      - name: Run rules test suite
        run: bash scripts/test_rules.sh

  # La TERCERA suite de Node del repo: scripts/test/*.test.js (#838).
  #
  # Mismo agujero que documenta `rules-test` acá arriba, con otro directorio.
  # Los tests de `scripts/test/` —los guards que deciden si un script de
  # `scripts/` puede escribir contra producción— no los corría NINGÚN job:
  # `analyze`/`test` son Flutter, `functions-*` tiene su testMatch acotado a
  # `functions/src/__tests__/`, y `rules-test` sólo toca `scripts/rules_test/`,
  # que es otro paquete con su propio lockfile. La única ejecución era que
  # alguien se acordara de correr `npm --prefix scripts test` a mano.
  #
  # Y lo que hay ahí adentro es exactamente el tipo de cosa que se borra sin
  # que nadie note: el arreglo del #838 son cuatro líneas de cableado
  # (`exigirDestinoCoherente(...)` al tope de cada script que sube a Storage).
  # Borrando una, sin este job, no se pone nada en rojo — y el script vuelve a
  # subir archivos a producción imprimiendo "destino: EMULADOR".
  #
  # Lo mismo vale para el trinquete del #834: `test/frontera.test.js` escanea
  # `scripts/` y falla si aparece un `initializeApp`, un `credential.cert` o una
  # lectura de `sa-key.json` fuera de `lib/`. Es un gate sobre archivos que
  # TODAVÍA NO EXISTEN, así que su valor entero depende de que corra solo: un
  # trinquete que alguien tiene que acordarse de mirar no es un trinquete. El
  # #834 llegó a tener el resolutor escrito y sin llamadores — mismo error, una
  # capa más arriba: un gate que nadie ejecuta y un módulo que nadie llama
  # fallan igual de silenciosos.
  #
  # Corre la suite ENTERA del directorio, no un archivo puntual: el #835 ya
  # dejó cuatro archivos de test ahí que tampoco corría nadie, y el que venga
  # después va a hacer lo mismo. `npm test` expande `test/*.test.js` en el
  # shell, así que cualquier archivo nuevo entra solo — por eso se invoca el
  # script del package.json y no una línea `run:` con el comando copiado
  # (misma razón que en `rules-test`).
  #
  # SIN `npm ci` a propósito, y no es un olvido: estos tests no importan una
  # sola dependencia de `scripts/package.json`. Los scripts bajo prueba se
  # cargan con `--require test/fixtures/stub_firebase_admin.js`, que intercepta
  # `Module._load` (CJS) y `module.register()` (ESM) y devuelve un
  # `firebase-admin` falso; el resto es todo `node:` builtin. Verificado
  # corriendo la suite con `scripts/node_modules` inexistente, con el comando
  # EXACTO de este job (`npm --prefix scripts test`, o sea
  # `node --test test/*.test.js` — el glob lo expande la shell, no Node) en
  # Node 20, 22 y 26: 439/439 en verde, y el MISMO número en las tres —un
  # conteo que baja con la versión es la firma de los subtests cancelados de
  # más abajo—. El comando importa para poder comparar: `--test scripts/test/`
  # a secas cuenta 442 en vez de 439 porque suma las entradas de directorio, y
  # dos números que no son el mismo experimento no se pueden restar.
  # Instalar `firebase-admin` acá sería medio minuto por run para nada — y
  # peor, dejaría que un test toque la red sin que se note.
  #
  # Node 20 igual que los otros jobs de Node, y NO se sube. Este job ya se puso
  # rojo una vez por una API que sólo existe de Node 22.15 para arriba
  # (`module.registerHooks`), y la tentación fue subir el job. Habría tapado el
  # problema real: sin el hook, el subproceso carga el `firebase-admin` DE
  # VERDAD y los tests de compuerta —que prueban la AUSENCIA de un marcador—
  # quedan verdes midiendo nada. El fix fue `module.register()`, que existe
  # desde Node 20.6, más un marcador de intercepción que los tests exigen en
  # cada corrida: `esm_stub_interception.test.js` lo custodia con control
  # negativo. La versión vieja de Node no es una molestia acá, es el CANARIO.
  #
  # Anda en 20 y en 22 también por el glob: el del `npm test` lo expande el
  # shell. El `--test "test/*.test.js"` entrecomillado que traía el #835 exigía
  # Node >= 22 —el test runner recién expande globs por su cuenta desde ahí— y
  # habría roto este job en silencio el día que se agregara; por eso el merge se
  # quedó con la forma sin comillas.
  #
  # Y por la misma razón los subtests de la matriz de 32 combinaciones se
  # `await`ean: hasta Node 24 el runner no espera solo a los subtests y los
  # cancela con `cancelledByParent`. Medido acá: en Node 20 y en Node 22 corría
  # UNA de las 32 y las otras 31 salían canceladas; en Node 26 pasaban todas.
  # Otra cobertura que decía estar y no estaba.
  scripts-test:
    name: Scripts Test (scripts/test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run scripts test suite
        run: npm --prefix scripts test
